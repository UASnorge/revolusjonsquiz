<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pi-loten">
<meta name="theme-color" content="#5b3df5">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Pi-loten – mattetrening til fagdagen</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f2efff;--ink:#1e1846;--mut:#6c6795;--pri:#5b3df5;--priD:#3d24c9;--pri2:#ebe6ff;--ok:#15803d;--ok2:#dcfce7;--warn:#a85a06;--warn2:#fef3c7;--bad:#dc2626;--bad2:#fee2e2;--line:#e3def7;--gold:#f59e0b}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:10px 12px 18px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:none}
.card{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 3px 0 var(--line);margin-bottom:12px}
.btn{display:block;background:var(--pri);color:#fff;border-radius:16px;padding:14px 18px;font-weight:800;font-size:17px;box-shadow:0 4px 0 var(--priD);width:100%;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--priD)}
.btn.g{background:#16a34a;box-shadow:0 4px 0 #0f7a37}
.btn2{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.mut{color:var(--mut)}
h1{font-size:24px;margin:2px 0}h2{font-size:19px;margin:2px 0 8px}h3{font-size:15px;margin:14px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:#fff;border-radius:18px;padding:12px 4px 10px;text-align:center;box-shadow:0 3px 0 var(--line);position:relative}
.tile:active{transform:translateY(2px);box-shadow:none}
.tile .ic{font-size:34px;line-height:1.15}
.tile .nm{font-weight:800;font-size:12.5px;margin-top:3px}
.stars{font-size:14px;letter-spacing:1px;color:#d4d0e8;margin-top:2px}.stars b{color:var(--gold);font-weight:400}
.bar{height:8px;border-radius:8px;background:var(--pri2);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:8px;transition:width .8s}
.big{font-size:24px;font-weight:800;letter-spacing:.3px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.2}
.fr>span{padding:0 3px;display:block;text-align:center}
.fr>span:first-child{border-bottom:2.5px solid currentColor}
.pr{font-size:17px;line-height:1.5;margin-top:4px}
.pr .big{display:inline-block;margin:4px 0}
mark{background:#fde68a;border-radius:5px;padding:0 3px;color:inherit}
.grid{display:grid;justify-content:center;row-gap:3px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:24px;font-weight:700;margin:6px 0 4px}
.gc{height:42px;min-width:34px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.gc.sm{height:18px;font-size:14px;color:var(--warn)}
.gc.ul{border-bottom:3px solid var(--ink);border-radius:0}
.gc.wide{padding:0 8px;font-size:21px}
.gc.vb{border-left:3px solid var(--ink);border-radius:0;min-width:0;width:14px}
.gc.rt{justify-content:flex-end;padding-right:6px}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:42px;padding:0 6px;border:2.5px dashed #b4acdc;border-radius:11px;font-weight:800;font-size:21px;vertical-align:middle;margin:2px;background:#fff;font-family:ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink)}
.grid .slot{margin:0;min-width:34px;height:40px;font-size:24px;padding:0 4px}
.slot.on{border:3px solid var(--pri);background:var(--pri2)}
.slot.on:empty::after{content:"";width:2px;height:22px;background:var(--pri);animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.slot.ok{border:2.5px solid transparent;color:var(--ok);background:transparent}
.slot.help{border:2.5px solid transparent;color:var(--warn);background:transparent}
.slot.miss{border:2.5px solid transparent;color:var(--bad);background:transparent}
.fr .slot{height:36px;min-width:38px;font-size:19px;margin:1px 0}
sup .slot{height:30px;min-width:32px;font-size:15px;margin:0 1px}
sup{font-size:65%}
.ln{font-size:19px;font-weight:600;margin:8px 0;line-height:2.1;animation:pop .35s}
.ln .cap{display:block;font-size:12.5px;color:var(--mut);font-weight:800;line-height:1.3;text-transform:uppercase;letter-spacing:.4px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.guide{display:flex;gap:6px;align-items:flex-end;margin:8px 0 4px}
.bub{flex:1;background:#fff;border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:15.5px;line-height:1.45;box-shadow:0 2px 0 var(--line);min-height:46px}
.bub.ok{background:var(--ok2);color:#14532d}.bub.warn{background:var(--warn2);color:#6b3d05}.bub.bad{background:var(--bad2);color:#7f1d1d}
.bub .fr>span:first-child{border-bottom-width:1.5px}
.okt{color:var(--ok)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;position:sticky;bottom:0;background:var(--bg);padding:8px 0 calc(6px + env(safe-area-inset-bottom));z-index:3}
.pad button{height:54px;border-radius:14px;background:#fff;font-size:24px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.pad button:active{transform:translateY(2px);box-shadow:none}
.pad .okb{background:#16a34a;color:#fff;box-shadow:0 3px 0 #0f7a37;grid-column:span 2}
.pad .hb{background:#fff7d6}
.pad .op{background:#efeaff;color:var(--priD)}
.glow{animation:glow 1.3s infinite}
@keyframes glow{50%{background:#fde047;box-shadow:0 0 0 7px #fde04777}}
.shake{animation:sh .3s 2}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:7px 0;font-weight:700;font-size:16px;line-height:1.4}
.opt.right{border-color:#16a34a;background:var(--ok2)}.opt.wx{border-color:var(--bad);background:var(--bad2);opacity:.75}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:62px;min-height:52px;padding:6px 10px;margin:4px;background:#fff;border:2.5px solid var(--line);border-radius:14px;font-weight:800;font-size:18px}
.chip.sel{border-color:var(--pri);background:var(--pri2)}
.chip.okc{border-color:#16a34a;background:var(--ok2)}
.chip.used{opacity:.2}
.drop{min-height:62px;border:2.5px dashed #b4acdc;border-radius:14px;padding:2px;display:flex;flex-wrap:wrap;align-items:center;margin:6px 0}
.drop .lt{color:var(--mut);font-weight:800;font-size:18px;margin:0 2px}
.tag{display:inline-block;border-radius:10px;padding:3px 9px;font-size:12px;font-weight:800;margin-top:8px}
.tag.calc{background:#e0f2fe;color:#075985}.tag.nc{background:#f3e8ff;color:#6b21a8}
.float{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-weight:900;font-size:28px;color:var(--pri);pointer-events:none;animation:up 1.1s forwards;z-index:20;text-shadow:0 2px 0 #fff}
@keyframes up{to{transform:translate(-50%,-90px);opacity:0}}
.prop{animation:spin .16s linear infinite;transform-origin:center;transform-box:fill-box}
@keyframes spin{50%{transform:scaleX(.2)}}
.hover{animation:hov 2.4s ease-in-out infinite}@keyframes hov{50%{transform:translateY(-4px)}}
.dots{display:flex;gap:5px}.dots i{width:11px;height:11px;border-radius:6px;background:#d6d0f0}.dots i.d{background:var(--pri)}.dots i.s{background:var(--gold)}.dots i.c{outline:2.5px solid var(--pri);outline-offset:1px}
input.name{width:100%;font-size:20px;padding:12px 14px;border:2.5px solid var(--line);border-radius:14px;font-weight:700;font-family:inherit;color:var(--ink)}
.leg>div{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.35}
.leg>div>span:first-child{font-size:26px;width:38px;text-align:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;background:#fff;font-weight:800;font-size:14px;box-shadow:0 2px 0 var(--line)}
.mode{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 var(--line);margin-bottom:9px;width:100%;text-align:left}
.mode .ic{font-size:30px;width:40px;text-align:center}
.mode b{display:block;font-size:16px}.mode small{color:var(--mut);font-size:13px}
.mission{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left;font-weight:700;font-size:15px}
.mission .ck{margin-left:auto;font-size:20px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{background:#fff;border-radius:16px;padding:12px 6px;text-align:center;box-shadow:0 3px 0 var(--line)}
.bdg .ic{font-size:36px}.bdg b{display:block;font-size:13px;margin-top:4px}.bdg small{font-size:11.5px;color:var(--mut)}
.bdg.off{filter:grayscale(1);opacity:.4}
.pre{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:19px;font-weight:700;background:#f7f5ff;border-radius:12px;padding:10px 14px;white-space:pre;overflow-x:auto;line-height:1.35;margin:6px 0}
.hstep{background:#f7f5ff;border-radius:12px;padding:10px 12px;margin:7px 0;font-size:16px;line-height:1.5;animation:pop .35s}
.list button{display:flex;width:100%;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:7px;box-shadow:0 2px 0 var(--line);text-align:left;font-weight:700}
.nl{width:100%;height:70px;display:block;margin:2px 0}
.strip{display:flex;gap:2px;margin:8px 0 4px}.strip i{flex:1;height:26px;border-radius:4px;background:#ece9f6;font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .4s}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;font-weight:700;color:var(--mut)}.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:4px}
table.price{border-collapse:collapse;margin-top:8px;background:#f7f5ff;border-radius:12px;overflow:hidden;font-size:16px}
table.price td{padding:6px 14px;font-weight:700}table.price td:last-child{text-align:right}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:30}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.xbtn{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 2px 0 var(--line);font-size:18px;font-weight:800}
.hintrow{display:flex;justify-content:flex-end;margin-top:4px}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="conf"></canvas>
<script>
"use strict";
/* ---------- verktøy ---------- */
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const rnd=x=>Math.round(x*1e9)/1e9;
const digits=n=>String(n).split('').map(Number);
const cap=s=>s[0].toUpperCase()+s.slice(1);
const isPrime=n=>{if(n<2||!Number.isInteger(n))return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};
const decs=x=>{const s=String(rnd(x));return s.includes('.')?s.split('.')[1].length:0};
function fmt(x){x=rnd(x);const neg=x<0;x=Math.abs(x);let s=(x>0&&x<1e-6)?x.toFixed(12).replace(/0+$/,''):String(x);let [i,d]=s.split('.');if(i.length>4)i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (neg?'−':'')+i+(d?','+d:'')}
function parse(v){if(typeof v==='number')return v;const s=String(v).replace(/\s| /g,'').replace(/−/g,'-').replace(',','.');if(s===''||s==='-'||s==='.')return NaN;return Number(s)}
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const PN=['enerne','tierne','hundrerne','tusenerne'];

/* ---------- Pi-loten (veilederen) ---------- */
function pilot(size,mood){size=size||56;mood=mood||'happy';
 const mouth=mood==='think'?'<path d="M40 52 q7 -3 14 0" stroke="#1e1846" stroke-width="3.2" fill="none" stroke-linecap="round"/>':mood==='wow'?'<ellipse cx="47" cy="52" rx="5" ry="6" fill="#1e1846"/>':'<path d="M38 49 q9 9 18 0" stroke="#1e1846" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
 const brow=mood==='think'?'<path d="M32 33 l9 2 M62 33 l-9 2" stroke="#1e1846" stroke-width="2.5" stroke-linecap="round"/>':'';
 return `<svg class="hover" width="${size}" height="${size*0.85}" viewBox="0 0 94 80" aria-hidden="true">
<line x1="22" y1="30" x2="11" y2="13" stroke="#3d24c9" stroke-width="5" stroke-linecap="round"/><line x1="72" y1="30" x2="83" y2="13" stroke="#3d24c9" stroke-width="5" stroke-linecap="round"/>
<ellipse class="prop" cx="11" cy="10" rx="12" ry="3.6" fill="#a5b4fc"/><ellipse class="prop" cx="83" cy="10" rx="12" ry="3.6" fill="#a5b4fc"/>
<rect x="15" y="22" width="64" height="48" rx="21" fill="#5b3df5"/><rect x="22" y="28" width="50" height="33" rx="15" fill="#fff"/>
<circle cx="38" cy="42" r="5" fill="#1e1846"/><circle cx="56" cy="42" r="5" fill="#1e1846"/><circle cx="40" cy="40" r="1.8" fill="#fff"/><circle cx="58" cy="40" r="1.8" fill="#fff"/>
${brow}${mouth}<text x="47" y="69" text-anchor="middle" font-size="9" font-weight="900" fill="#fde047" font-family="Georgia,serif">π</text></svg>`}

/* ---------- temaer ---------- */
const TOPICS=[
 {id:'opp',ico:'✏️',name:'Oppstilling',sub:'Minus, gange og deling'},
 {id:'neg',ico:'🌡️',name:'Negative tall',sub:'Regn og sorter tall'},
 {id:'brok',ico:'🍕',name:'Brøk',sub:'Forkort, pluss, gange, dele'},
 {id:'pro',ico:'💯',name:'Prosent',sub:'Prosent av og hvor mange prosent'},
 {id:'prim',ico:'🌳',name:'Primtall',sub:'Primtallsfaktorisering'},
 {id:'over',ico:'🛍️',name:'Overslag',sub:'Rund av og regn i hodet'},
 {id:'std',ico:'🚀',name:'Standardform',sub:'Store og små tall'},
 {id:'rek',ico:'🧩',name:'Regnerekkefølge',sub:'Parenteser, potenser, brøkstrek'},
 {id:'prob',ico:'🧠',name:'Problemløsning',sub:'Tekstoppgaver med kalkulator'}];
const TT=id=>TOPICS.find(t=>t.id===id);
const SUBS={opp:[['sub',1],['mul',1],['div',1]],neg:[['calc',1],['ord1',1],['ord2',2]],brok:[['fork',1],['av',1],['mul',2],['pm',2],['div',3],['del',3]],pro:[['av',1],['hvor',2],['tekst',2]],prim:[['fakt',1],['birger',2]],over:[['handle',1],['gange',2]],std:[['stor',1],['liten',1],['mill',2],['tilbake',2],['gange',3]],rek:[['enkel',1],['brok',2],['parentes',3]],prob:[['rabatt',1],['kommune',2],['drops',2]]};

/* ---------- byggeklosser for oppgaver ---------- */
function TB(topic,sub,title,prompt,o){return Object.assign({topic,sub,title,prompt,steps:[],lines:[],grid:null,calc:false,vals:{},fxv:{}},o||{})}
function SL(t,a,h,o){t.steps.push(Object.assign({k:'slot',a,h},o||{}));return {s:t.steps.length-1}}
function LN(t,cap,parts,o){t.lines.push(Object.assign({cap,parts},o||{}))}
function CH(t,q,opts,h,o){t.steps.push(Object.assign({k:'choice',q,opts,h},o||{}));LN(t,'',[{o:t.steps.length-1}])}
function SIMP(t,n,d,c){const g=gcd(n,d);if(g===1||d/g===1)return false;
 const s1=SL(t,n/g,[`Kan ${fr(n,d)} forkortes? Finn det største tallet som går opp i både ${n} og ${d}.`,`Del både teller og nevner på ${g}.`],{w:v=>(v>n/g&&Number.isInteger(n/v)&&g%(n/v)===0)?'Riktig retning, men det kan forkortes enda mer!':null});
 const s2=SL(t,d/g,['Del nevneren på det samme tallet.',`${d} : ${g} = ?`]);LN(t,c||'Forkort svaret',[fr(n,d),' = ',{f:[s1,s2]}]);return true}

const G={};
/* ✏️ OPPSTILLING */
function borrows(a,b){const A=digits(a).reverse(),B=digits(b).reverse();return B.some((d,i)=>d>A[i])}
G.opp_sub=()=>{let a,b;do{a=R(211,989);b=Math.random()<.5?R(12,98):R(102,a-40)}while(/0/.test(String(a))||!borrows(a,b)||a-b<10);
 const c=a-b,ad=digits(a).reverse(),bd=digits(b).reverse(),cd=digits(c).reverse(),L=3;
 const t=TB('opp','sub','Regn ut. Vis fremgangsmåte',`<span class="big">${a} − ${b}</span>`);
 const cells=[];
 for(let i=0;i<L;i++){cells.push({r:0,c:L-i,t:'',key:'b'+i,sm:1});cells.push({r:1,c:L-i,t:String(ad[i]),key:'a'+i})}
 cells.push({r:2,c:0,t:'−',ul:1});for(let i=0;i<L;i++)cells.push({r:2,c:L-i,t:bd[i]!=null?String(bd[i]):'',ul:1});
 let bin=0;
 for(let i=0;i<cd.length;i++){const orig=ad[i],x=orig-bin,y=bd[i]||0,bo=x<y,val=bo?x+10-y:x-y;
  const note=bin?` (Du lånte 1 herfra, så ${orig} er blitt ${x}.)`:'';const P_=cap(PN[i]);
  const h=bo?[`${P_}: ${x} − ${y} går ikke.${note} Lån 1 fra kolonnen til venstre. Da får du ${x+10} − ${y}.`,`Tell opp fra ${y} til ${x+10}. Hvor mange steg er det?`]:[`${P_}: ${x} − ${y} = ?${note}`,`Tell ned ${y} fra ${x}.`];
  const w=v=>bo&&v===y-x?`Du regnet ${y} − ${x}. Det går ikke an å snu det! Du må låne 10.`:(bin&&v===val+1?'Husk at du lånte 1 fra denne kolonnen.':null);
  const fx=bo?[['a'+(i+1),`<s style="opacity:.4">${ad[i+1]}</s>`],['b'+(i+1),String(ad[i+1]-1)]]:null;
  const s=SL(t,val,h,{w,one:1,fx});cells.push({r:3,c:L-i,s:s.s});bin=bo?1:0}
 t.grid={cols:`repeat(${L+1},36px)`,cells};t.sol=`${a} − ${b} = ${c}`;return t};
G.opp_mul=()=>{let a,b;do{a=Math.random()<.6?R(12,98):R(112,489);b=R(3,9)}while(/0/.test(String(a))||!digits(a).some(d=>d*b>=10));
 const p=a*b,ad=digits(a).reverse(),W=String(p).length;
 const t=TB('opp','mul','Regn ut. Vis fremgangsmåte',`<span class="big">${a} · ${b}</span>`);
 const cells=[];for(let i=0;i<W;i++)cells.push({r:0,c:W-i,t:'',key:'m'+i,sm:1});
 ad.forEach((d,i)=>cells.push({r:1,c:W-i,t:String(d)}));
 cells.push({r:2,c:0,t:'·',ul:1});for(let i=0;i<W;i++)cells.push({r:2,c:W-i,t:i===0?String(b):'',ul:1});
 let carry=0;
 ad.forEach((d,i)=>{const pr=d*b,tot=pr+carry,dig=tot%10,nc=Math.floor(tot/10),last=i===ad.length-1;
  const h=[`${cap(PN[i])}: ${b} · ${d}${carry?` + menten ${carry}`:''}. Skriv bare enerne i svaret.`,`${b} · ${d} = ${pr}${carry?`, og ${pr} + ${carry} = ${tot}`:''}. Enerne i ${tot} er …?`];
  const w=v=>carry&&v===pr%10?`Glemte du menten ${carry}?`:(tot>=10&&v===nc&&nc!==dig?'Det er tieren. Skriv enerne her – tieren går i mente.':null);
  const fx=nc&&!last?[['m'+(i+1),String(nc)]]:null;
  const s=SL(t,dig,h,{w,one:1,fx});cells.push({r:3,c:W-i,s:s.s});
  if(last&&nc){const s2=SL(t,nc,[`Til slutt: du hadde ${tot}. Skriv tieren foran.`,`Tieren i ${tot} er ${nc}.`],{one:1});cells.push({r:3,c:W-i-1,s:s2.s})}
  carry=nc});
 t.grid={cols:`repeat(${W+1},36px)`,cells};t.sol=`${a} · ${b} = ${p}`;return t};
function simDiv(n,d){const ds=digits(n);let idx=0,cur=ds[0];while(cur<d&&idx<ds.length-1){idx++;cur=cur*10+ds[idx]}const start=idx,out=[];

function ladder(t,n){const cells=[];let cur=n,r=0;const fs=[];cells.push({r:0,c:0,t:String(n),rt:1});
 while(cur>1){const p=[2,3,5,7,11,13].find(x=>cur%x===0);fs.push(p);const c0=cur;
  const rule=p===2?`${c0} er et partall, så 2 går opp.`:p===3?`Tverrsummen av ${c0} er ${digits(c0).reduce((a,b)=>a+b)}, som er i 3-gangen. Da går 3 opp.`:p===5?`${c0} slutter på 5 eller 0, så 5 går opp.`:`Prøv ${p}: står ${c0} i ${p}-gangen?`;
  const s1=SL(t,p,[`Hvilket er det minste primtallet som går opp i ${c0}? Prøv 2, så 3, så 5, så 7 …`,rule],{w:v=>v===1?'1 er ikke et primtall.':(c0%v===0&&v>1?(isPrime(v)?`${v} går opp, men vi starter alltid med det minste primtallet som går opp.`:`${v} går opp i ${c0}, men ${v} er ikke et primtall! Det var akkurat den feilen Birger gjorde.`):`${v} går ikke opp i ${c0}.`)});
  cells.push({r,c:1,t:'',vb:1});cells.push({r,c:2,s:s1.s});cur=c0/p;r++;
  const s2=SL(t,cur,[`Del: ${c0} : ${p} = ?`,`${p} · ? = ${c0}`]);cells.push({r,c:0,s:s2.s,rt:1})}
 cells.push({r,c:1,t:'',vb:1});t.grid={cols:'auto 16px 52px',cells};
 const grp={};fs.forEach(p=>grp[p]=(grp[p]||0)+1);
 t.sol=`${n} = ${fs.join(' · ')} = ${Object.entries(grp).map(([p,e])=>e>1?`${p}<sup>${e}</sup>`:p).join(' · ')}`}

function kommuneViz(k,r,D){const cols=['#f97316','#0ea5e9','#ec4899','#16a34a'];const names=['Under 6 år','6–15 år','Over 67 år','16–67 år'];
 return t=>{let cells='',idx=0;const done=[0,1,2].map(i=>S.st[i]&&S.st[i].done),rd=S.st[4]&&S.st[4].done;
  [...k,r].forEach((n,g)=>{for(let j=0;j<n;j++){const on=g<3?done[g]:rd;cells+=`<i style="background:${on?cols[g]:'#ece9f6'}">${g===3&&on&&j===0?'':''}</i>`;idx++}});
  return `<div class="strip">${cells}</div><div class="lg">${names.map((n,i)=>`<span style="--c:${cols[i]}">${n}</span>`).join('')}</div><div class="mut" style="font-size:12px;margin-top:3px">Hver rute er ${fr(1,D)} av innbyggerne.</div>`}}

 const u=pick([500,800,1000,1200,1500,2000,2400,3000]),G_=r*u;const fs=k.map(x=>{const g=gcd(x,D);return [x/g,D/g]});
 const t=TB('prob','kommune','Hvor mange innbyggere?',`I en kommune er det ${fmt(G_)} innbyggere mellom 16 og 67 år. ${fr(...fs[0])} av innbyggerne er yngre enn 6 år, ${fr(...fs[1])} er mellom 6 og 15 år, og ${fr(...fs[2])} er eldre enn 67 år. Hvor mange innbyggere er det i kommunen?`,{calc:true});
 k.forEach((x,i)=>{const [p,q]=fs[i];const s_=SL(t,x,[`Gjør om til ${D}-deler: hva må du gange ${q} med for å få ${D}? Gang telleren med det samme.`,`${q} · ${D/q} = ${D}, så telleren blir ${p} · ${D/q}.`]);LN(t,i?'':`Gjør om til ${D}-deler`,[fr(p,q),' = ',{f:[s_,String(D)]}])});

 const s6=SL(t,u,[`${fr(r,D)} er ${fmt(G_)} personer. Da finner du ${fr(1,D)} ved å dele på ${r}.`,`${fmt(G_)} : ${r} = ?`]);LN(t,`${fr(1,D)} av innbyggerne`,[`${fmt(G_)} : ${r} = `,s6]);
 const s7=SL(t,D*u,[`Alle innbyggerne er ${D} slike deler.`,`${fmt(u)} · ${D} = ?`]);LN(t,'Alle innbyggerne',[`${fmt(u)} · ${D} = `,s7]);
 t.viz=kommuneViz(k,r,D);t.sol=`Det er ${fmt(D*u)} innbyggere i kommunen`;return t}};

const BADGES=[
 ['first','🛫','Første tur','Fullfør din første runde',p=>p.st.rounds>=1],
 ['lyn','⚡','Lynrask','20 lynsvar',p=>p.st.lyn>=20],
 ['streak','🔥','Brennhet','10 riktige på rad',p=>p.st.best>=10],
 ['clean','⭐','Feilfri runde','En hel runde uten hjelp',p=>p.st.cleanRounds>=1],
 ['fight','🧗','Gir aldri opp','Fullfør etter 3 feil eller mer',p=>p.st.fight>=1],
 ['explore','🗺️','Utforsker','Prøv alle 9 temaene',p=>TOPICS.every(T=>p.m[T.id]!=null)],
 ['bronze','🥉','Bronse overalt','Bronse i alle temaer',p=>TOPICS.every(T=>(p.m[T.id]||0)>=35)],
 ['gold','🥇','Gullpilot','Gull i ett tema',p=>TOPICS.some(T=>(p.m[T.id]||0)>=85)],
 ['paper','📝','Papirhelt','Vurder 10 heftoppgaver',p=>Object.keys(p.heft).length>=10],
 ['trap','🪤','Fellefanger','Tøm Feilfella',p=>p.st.trapEmptied>=1],
 ['exam','🏆','Prøveklar','Minst 80 % i prøvemodus',p=>p.st.examBest>=80],
 ['master','🎓','Mattemester','Gull i alle temaer',p=>TOPICS.every(T=>(p.m[T.id]||0)>=85)]];

const RIGHT=['Riktig!','Sånn!','Stødig flyging!','Rett i blinken!','Yes!','Nydelig!','Helt riktig!'];
const FAST=['Lynrask!','Wow, det gikk fort!','Turbo!'];

/* ---------- lagring ---------- */
const KEY='mattefagdag-pilot-v1';
let DB={players:{},cur:null};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.players)DB=x}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const P=()=>DB.players[DB.cur];
const newPlayer=name=>({name,xp:0,m:{},ff:[],heft:{},st:{rounds:0,lyn:0,best:0,cleanRounds:0,fight:0,trapEmptied:0,examBest:0},log:{},badges:[],days:[],seenHelp:false});
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dstr(new Date());
function logT(k){const p=P(),d=today();p.log[d]=p.log[d]||{};p.log[d][k]=(p.log[d][k]||0)+1;if(!p.days.includes(d))p.days.push(d);save()}
function dayStreak(p){let n=0;const d=new Date();if(!p.days.includes(dstr(d)))d.setDate(d.getDate()-1);while(p.days.includes(dstr(d))){n++;d.setDate(d.getDate()-1)}return n}
function daysLeft(){const t=new Date();t.setHours(0,0,0,0);return Math.round((FAGDAG-t)/864e5)}

/* ---------- tilstand og spillmotor ---------- */
let S={view:'home'};
function lvl(){if(S.round&&S.round.mode==='exam')return 3;const m=P().m[S.task.topic]||0;return m<35?0:m<70?1:2}
const hv=(h,t)=>typeof h==='function'?h(t):h;
function disp(step,t){if(step.dyn)return String(step.dyn(t));return step.show!=null?step.show:fmt(step.a)}
function isOk(step,v,t){const x=parse(v);if(isNaN(x))return false;if(step.ok)return step.ok(x,t);const tol=step.tol!=null?step.tol:Math.max(1e-9,Math.abs(step.a)*1e-9);return Math.abs(x-step.a)<=tol}

function startRound(mode,topic){const p=P();let list=[];
 if(mode==='topic'){const m=p.m[topic]||0,maxD=1+Math.floor(m/34);const subs=SUBS[topic].filter(x=>x[1]<=maxD).map(x=>x[0]);while(list.length<5)list.push(...shuffle(subs).map(s=>({t:topic,s})));list=list.slice(0,5)}
 if(mode==='trap'){if(!p.ff.length){go('home');return}list=shuffle(p.ff).slice(0,5).map(x=>({t:x.t,s:x.s}))}
 if(mode==='exam'){list=shuffle(TOPICS.map(T=>({t:T.id,s:pick(SUBS[T.id].filter(x=>x[1]<=2)).at(0)})))}
 S.round={mode,topic,list,i:0,gained:0,stars:0,steps:0,right:0,mStart:Object.assign({},p.m),results:[]};S.streak=0;loadTask()}
function loadTask(){const {t,s}=S.round.list[S.round.i];const task=makeTask(t,s);S.task=task;S.cur=0;S.finished=false;S.glow=false;
 S.st=task.steps.map(()=>({v:'',done:0,wrong:0,hint:0,hb:0,helped:0,miss:0,t0:0,placed:[],sel:[],wx:[]}));enterStep('');go('task')}
function nextTask(){S.round.i++;if(S.round.i>=S.round.list.length)return endRound();loadTask()}
function enterStep(prefix){const step=S.task.steps[S.cur],st=S.st[S.cur],L=lvl();st.t0=Date.now();S.glow=false;let instr='';
 if(L===0){instr=hv(step.h[0],S.task);st.hint=1}else if(L===1)instr=pick(GO)+' <span class="mut">Trykk 💡 hvis du vil ha hjelp.</span>';
 if(step.k==='choice'||step.k==='order'||step.k==='multi'){if(L===2)instr='';}
 const parts=[prefix,instr].filter(Boolean);
 S.msg={html:parts.join('<br>')||(L===3?'Prøvemodus: ingen hint. Gjør ditt beste!':pick(GO)),kind:'',mood:'happy'}}
function key(k){if(S.finished||S.view!=='task')return;const step=S.task.steps[S.cur],st=S.st[S.cur];if(!step||step.k!=='slot')return;
 if(k==='del')st.v=st.v.slice(0,-1);
 else if(k==='ok'){if(!st.v||st.v==='-'){S.msg={html:'Skriv et svar først 🙂',kind:'',mood:'happy'};return renderTask()}return check(st.v)}
 else if(k==='-'){st.v=st.v.startsWith('-')?st.v.slice(1):'-'+st.v}
 else if(k===','){if(!st.v.includes(','))st.v+=(st.v===''||st.v==='-')?'0,':','}
 else{if(step.one){st.v=k;return check(k)}if(st.v.replace('-','').length<14)st.v+=k}
 renderTask()}
function check(v){const step=S.task.steps[S.cur],st=S.st[S.cur];if(isOk(step,v,S.task)){S.task.vals[S.cur]=parse(v);return right()}
 wrongCommon(step.w?step.w(parse(v),S.task):null)}
function markDone(){const step=S.task.steps[S.cur];if(step.fx)step.fx.forEach(([k,h])=>S.task.fxv[k]=h)}
function reveal(step,st){if(step.k==='slot'){st.v=disp(step,S.task);S.task.vals[S.cur]=step.dyn?step.dyn(S.task):step.a}
 if(step.k==='choice')st.pick=step.opts.findIndex(o=>o.ok);
 if(step.k==='order')st.placed=sortedIdx(step);
 if(step.k==='multi')st.sel=step.items.map((x,i)=>x.ok?i:-1).filter(i=>i>=0)}
function sortedIdx(step){return step.items.map((x,i)=>i).sort((a,b)=>step.items[a].v-step.items[b].v)}
function award(n){P().xp+=n;S.round.gained+=n;const f=document.createElement('div');f.className='float';f.textContent='+'+n;document.body.appendChild(f);setTimeout(()=>f.remove(),1100)}
function right(){const step=S.task.steps[S.cur],st=S.st[S.cur],L=lvl();st.done=1;markDone();
 if(L===3)return advance('<b class="okt">✓</b>');
 const el=Date.now()-st.t0,thr=step.k==='slot'?(step.one?7000:15000):(step.k==='choice'?15000:25000);
 const clean=!st.wrong&&!st.hb;let pts=st.wrong?70:100,msg=pick(RIGHT);
 if(clean&&el<thr){pts+=50;P().st.lyn++;msg=pick(FAST)+' ⚡ +50'}
 S.streak=(S.streak||0)+1;if(S.streak>P().st.best)P().st.best=S.streak;if(S.streak%5===0){pts+=100;msg+=` 🔥 ${S.streak} på rad! +100`}
 if(step.ex)msg+=`<br>${step.ex}`;
 award(pts);advance(`<b class="okt">${msg}</b>`)}
function wrongCommon(typ){const step=S.task.steps[S.cur],st=S.st[S.cur],L=lvl();st.wrong++;S.streak=0;S.shake=S.cur;
 if(L===3){reveal(step,st);st.miss=1;st.done=1;markDone();return advance(`<span style="color:var(--bad);font-weight:800">Fasit:</span> ${step.k==='slot'?disp(step,S.task):'se markert svar'}`)}
 const need=[1,2,3][L];
 if(st.wrong>=need){const nh=nextHint(st,step);if(nh===null)return fill(typ);S.msg={html:(typ?typ+'<br>':'')+'💡 '+nh,kind:'warn',mood:'think'}}
 else S.msg={html:typ||pick(WRONG),kind:'bad',mood:'think'};
 if(step.k==='slot')st.v='';renderTask()}
function nextHint(st,step){if(st.hint>=step.h.length)return null;return hv(step.h[st.hint++],S.task)}
function hintBtn(){if(S.finished)return;const step=S.task.steps[S.cur],st=S.st[S.cur];st.hb++;const nh=nextHint(st,step);if(nh===null)return fill(null);S.glow=false;S.msg={html:'💡 '+nh,kind:'warn',mood:'think'};renderTask()}
function fill(typ){const step=S.task.steps[S.cur],st=S.st[S.cur];st.done=1;st.helped=1;reveal(step,st);markDone();award(30);
 advance(`${typ?typ+'<br>':''}Her fikk du hjelp: svaret er <b>${step.k==='slot'?disp(step,S.task):'markert'}</b>. Se på det – en lignende oppgave kommer i Feilfella 🪤.`)}
function advance(prefix){const t=S.task;let n=S.cur+1;while(n<t.steps.length&&S.st[n].done)n++;if(n>=t.steps.length)return finishTask(prefix);S.cur=n;enterStep(prefix);renderTask()}
function finishTask(prefix){const t=S.task,R_=S.round,p=P(),L=lvl();S.finished=true;
 let sc=0,clean=true,fight=false;S.st.forEach(st=>{const c=!st.wrong&&!st.hb&&!st.helped&&!st.miss;if(!c)clean=false;sc+=st.miss||st.helped?0:st.wrong?0.6:st.hb?0.7:1;if(st.wrong>=3&&!st.helped)fight=true});
 sc/=S.st.length;
 if(R_.mode==='exam'){R_.steps+=S.st.length;R_.right+=S.st.filter(s=>!s.miss).length}
 const m0=p.m[t.topic]||0;p.m[t.topic]=Math.round(m0+(sc*100-m0)*(R_.mode==='exam'?0.15:0.22));
 if(sc<0.7&&!p.ff.some(x=>x.t===t.topic&&x.s===t.sub))p.ff.push({t:t.topic,s:t.sub});
 if(R_.mode==='trap'&&sc>=0.8){const i=p.ff.findIndex(x=>x.t===t.topic&&x.s===t.sub);if(i>=0){p.ff.splice(i,1);if(!p.ff.length)p.st.trapEmptied++}}
 if(fight)p.st.fight++;
 R_.results.push(clean?'s':'d');
 let msg;
 if(L===3)msg=(prefix?prefix+'<br>':'')+'Oppgave ferdig.';
 else if(clean){R_.stars++;award(150);msg=`${prefix?prefix+'<br>':''}⭐ <b>Uten hjelp! +150</b>`}
 else if(sc>=0.6)msg=`${prefix?prefix+'<br>':''}Godt jobbet! 💪`;
 else msg=`${prefix?prefix+'<br>':''}Bra at du fullførte! Denne typen kommer igjen i Feilfella 🪤`;
 if(t.sol)msg+=`<div style="margin-top:6px;font-weight:800">${t.sol}</div>`;
 S.msg={html:msg,kind:clean?'ok':'',mood:clean?'wow':'happy'};save();renderTask();setTimeout(()=>{const b=$('#nextb');b&&b.scrollIntoView({behavior:'smooth',block:'end'})},150)}
function endRound(){const R_=S.round,p=P();p.st.rounds++;if(R_.mode!=='exam'&&R_.stars===R_.list.length)p.st.cleanRounds++;
 if(R_.mode==='exam'){R_.pct=Math.round(R_.right/Math.max(1,R_.steps)*100);p.st.examBest=Math.max(p.st.examBest,R_.pct);logT('p')}else if(R_.mode==='trap')logT('f');else logT('t:'+R_.topic);
 const nb=BADGES.filter(b=>!p.badges.includes(b[0])&&b[4](p));nb.forEach(b=>p.badges.push(b[0]));R_.newBadges=nb;save();go('end');
 if(R_.stars>=3||(R_.pct||0)>=80||nb.length)confetti()}
function choose(j){const step=S.task.steps[S.cur],st=S.st[S.cur];if(st.done||S.finished)return;if(step.opts[j].ok){st.pick=j;return right()}if(!st.wx.includes(j))st.wx.push(j);wrongCommon(step.w?step.w(j):null)}
function place(j){const step=S.task.steps[S.cur],st=S.st[S.cur];if(st.done||S.finished||st.placed.includes(j))return;const so=sortedIdx(step),need=so[st.placed.length];
 if(step.items[j].v===step.items[need].v){st.placed.push(j);if(st.placed.length===step.items.length)return right();return renderTask()}
 wrongCommon(step.w?step.w(step.items[j].v,step.items[need].v):null)}
function unplace(){const st=S.st[S.cur];if(st.done)return;st.placed.pop();renderTask()}
function toggle(j){const st=S.st[S.cur];if(st.done||S.finished)return;const i=st.sel.indexOf(j);if(i>=0)st.sel.splice(i,1);else st.sel.push(j);renderTask()}
function checkMulti(){const step=S.task.steps[S.cur],st=S.st[S.cur];const ok=step.items.map((x,i)=>x.ok?i:-1).filter(i=>i>=0);
 const miss=ok.filter(i=>!st.sel.includes(i)).length,extra=st.sel.filter(i=>!step.items[i].ok).length;
 if(!miss&&!extra)return right();wrongCommon(`${extra?`${extra} av prisene du valgte går ikke opp. `:''}${miss?`Du mangler ${miss}.`:''}`)}
function quit(){clearTimeout(S.hes);save();go('home')}

const VIEWS={};
function go(v,extra){clearTimeout(S.hes);Object.assign(S,{view:v},extra||{});$('#app').innerHTML=VIEWS[v]();window.scrollTo(0,0);if(v==='task')afterTask()}
function renderTask(){clearTimeout(S.hes);$('#app').innerHTML=VIEWS.task();afterTask()}
function afterTask(){const el=document.querySelector('.slot.on');if(S.shake!=null){document.querySelectorAll('.shk').forEach(e=>e.classList.add('shake'))}S.shake=null;armHes();
 if(el){const r=el.getBoundingClientRect(),padH=($('.pad')||{offsetHeight:0}).offsetHeight;if(r.bottom>window.innerHeight-padH-90||r.top<0)el.scrollIntoView({block:'center',behavior:'smooth'})}}
function armHes(){clearTimeout(S.hes);if(S.view!=='task'||S.finished||S.glow||lvl()!==0)return;const st=S.st[S.cur];const rem=22000-(Date.now()-st.t0);
 S.hes=setTimeout(()=>{if(S.view!=='task'||S.finished)return;S.glow=true;S.msg={html:S.msg.html+'<br><b>Står du litt fast? Trykk på 💡 – det er helt lov!</b>',kind:S.msg.kind,mood:'think'};renderTask()},Math.max(rem,1500))}

 const prog=nx?Math.round((p.xp-r[0])/(nx[0]-r[0])*100):100;

 return `<div class="top"><span class="pill">${r[2]} ${r[1]}</span><span class="pill">✨ ${p.xp} XP</span>${ds?`<span class="pill">🔥 ${ds} ${ds===1?'dag':'dager'}</span>`:''}<span class="sp"></span><button class="xbtn" onclick="go('help')" aria-label="Symboler og hjelp">?</button></div>
${guideHTML({html:`<b>Hei ${esc(p.name)}!</b> ${greet}`,mood:'happy'},64)}
<div class="card" style="padding:10px 14px"><div class="row" style="font-size:13px;font-weight:800"><span>${r[2]} ${r[1]}</span><span class="sp"></span><span class="mut">${nx?`${nx[0]-p.xp} XP til ${nx[2]} ${nx[1]}`:'Høyeste rang!'}</span></div><div class="bar" style="margin-top:6px"><i style="width:${prog}%"></i></div></div>
<div class="card"><div class="row"><h2 style="margin:0">🗓️ ${isToday?'Dagens oppdrag':'Oppdrag'}</h2><span class="sp"></span><button class="btn2" style="padding:5px 10px;font-size:13px" onclick="go('plan')">Hele planen</button></div><div class="mut" style="font-size:13px;margin:2px 0 4px">${pl.l}</div>
${pl.it.map(it=>{const d=itemDone(it,log);const g=itemGo(it);return `<button class="mission" ${g?`onclick="${g}"`:''}>${itemLabel(it)}<span class="ck">${it[0]==='x'?'':d?'✅':'▶️'}</span></button>`}).join('')}</div>
<h3>Temakartet</h3><div class="tiles">${TOPICS.map(T=>{const m=p.m[T.id];return `<button class="tile" onclick="startRound('topic','${T.id}')"><div class="ic">${T.ico}</div><div class="nm">${T.name}</div>${starHTML(starsOf(m||0))}<div class="bar" style="margin:5px 10px 0;height:5px"><i style="width:${m||0}%"></i></div></button>`}).join('')}</div>
<h3>Flere måter å øve på</h3>
<button class="mode" onclick="${p.ff.length?"startRound('trap')":"toast('Feilfella er tom – bra! Oppgaver du sliter med, havner her.')"}"><span class="ic">🪤</span><span><b>Feilfella ${p.ff.length?`(${p.ff.length})`:''}</b><small>Oppgavetyper du har bommet på – med nye tall</small></span></button>
<button class="mode" onclick="go('heft')"><span class="ic">📝</span><span><b>Heftet på papir</b><small>Oppgavene fra øvingsheftet – regn på papir, sjekk steg for steg</small></span></button>
<button class="mode" onclick="startRound('exam')"><span class="ic">🎯</span><span><b>Prøvemodus</b><small>Ni blandede oppgaver uten hint – som på fagdagen</small></span></button>
<button class="mode" onclick="go('badges')"><span class="ic">🏅</span><span><b>Medaljer</b><small>${p.badges.length} av ${BADGES.length} samlet</small></span></button>
<div class="row" style="justify-content:center;margin:14px 0 4px"><button class="btn2" style="font-size:13px" onclick="go('start')">Bytt spiller</button></div>
<div id="toast"></div>`};
function toast(t){const el=$('#toast');if(el){el.innerHTML=guideHTML({html:t,mood:'happy'},44);el.scrollIntoView({behavior:'smooth'})}}

VIEWS.help=()=>{const p=P();if(p){p.seenHelp=true;save()}return `<div class="top"><button class="xbtn" onclick="go('home')" aria-label="Tilbake">←</button><h1>Slik spiller du</h1></div>
${guideHTML({html:'Jeg er Pi-loten, veilederen din. Her er symbolene du møter:',mood:'happy'},60)}
<div class="card leg">
<div><span>✏️</span><span><b>Still opp og vis utregningen.</b> Du fyller inn ett tall om gangen, akkurat som på papiret. Ruten som lyser lilla, er den du skal fylle ut.</span></div>
<div><span>💡</span><span><b>Hint.</b> Trykk når du står fast. Første hint er en huskeregel, neste er mer konkret.</span></div>
<div><span>⚡</span><span><b>Lynbonus.</b> Ingen klokke – men svarer du raskt og riktig, får du +50.</span></div>
<div><span>⭐</span><span><b>Uten hjelp.</b> Løser du en hel oppgave uten hint og feil, får du en stjerne og +150.</span></div>
<div><span>🔥</span><span><b>På rad.</b> Hver gang du har 5 riktige på rad: +100.</span></div>
<div><span>★★★</span><span><b>Bronse, sølv og gull</b> i hvert tema. Jo bedre du mestrer temaet, jo mindre hjelp får du automatisk – akkurat som med en hjelpelærer.</span></div>
<div><span>🧮</span><span><b>Kalkulator lov</b> (del 3). Skriv likevel regnestykket!</span></div>
<div><span>🪤</span><span><b>Feilfella.</b> Oppgaver du bommer på, kommer tilbake med nye tall til du knekker dem.</span></div>
<div><span>📝</span><span><b>Heftet på papir.</b> Regn i kladdeboka, og sjekk løsningen steg for steg.</span></div>
<div><span>🎯</span><span><b>Prøvemodus.</b> Som på fagdagen: ingen hint.</span></div>
<div><span>🏅</span><span><b>Medaljer og ranger.</b> Fra 🎒 Lærling til 🎓 Mattemester.</span></div>
</div>
<div class="card"><h2>Tastaturet</h2><div style="font-size:15px;line-height:1.6"><b>−</b> gjør tallet negativt · <b>,</b> er komma · <b>⌫</b> sletter · <b>✓</b> sjekker svaret.<br>I oppstillinger med ett siffer per rute sjekkes svaret med en gang.</div></div>
<button class="btn" onclick="go('home')">Jeg er klar! ✈️</button><div style="height:10px"></div>`};

VIEWS.plan=()=>{const p=P(),d=today();return `<div class="top"><button class="xbtn" onclick="go('home')" aria-label="Tilbake">←</button><h1>Planen mot fagdagen</h1></div>
${guideHTML({html:'Ca. 20 minutter om dagen holder. Ta oppdragene i rekkefølge – og husk Feilfella!',mood:'happy'},50)}
${PLAN.map(pl=>`<div class="card" style="${pl.d===d?'outline:3px solid var(--pri)':''}"><div class="row"><b>${pl.l}</b>${pl.d===d?'<span class="sp"></span><span class="pill" style="background:var(--pri2)">I dag</span>':''}</div>${pl.it.map(it=>{const g=itemGo(it);return `<button class="mission" ${g?`onclick="${g}"`:''}>${itemLabel(it)}<span class="ck">${it[0]==='x'?'':itemDone(it,p.log[pl.d])?'✅':'○'}</span></button>`}).join('')}</div>`).join('')}`};

VIEWS.badges=()=>{const p=P();return `<div class="top"><button class="xbtn" onclick="go('home')" aria-label="Tilbake">←</button><h1>Medaljer</h1></div>
<div class="card"><h2>Ranger</h2>${RANKS.map(r=>`<div class="row" style="padding:5px 0;${p.xp>=r[0]?'':'opacity:.4'}"><span style="font-size:24px">${r[2]}</span><b>${r[1]}</b><span class="sp"></span><span class="mut">${r[0]} XP</span></div>`).join('')}</div>
<div class="badges">${BADGES.map(b=>`<div class="bdg ${p.badges.includes(b[0])?'':'off'}"><div class="ic">${b[1]}</div><b>${b[2]}</b><small>${b[3]}</small></div>`).join('')}</div><div style="height:16px"></div>`};

VIEWS.heft=()=>{const p=P();const row=h=>{const r=p.heft[h.id];const T=TT(h.topic);return `<button onclick="go('heftItem',{hid:'${h.id}',hs:0})"><span style="font-size:22px">${T.ico}</span><span>Oppgave ${h.id.replace('D','')}</span><span class="sp"></span><span style="font-size:20px">${r===0?'✅':r===1?'🟡':r===2?'🔴':'✏️'}</span></button>`};
 return `<div class="top"><button class="xbtn" onclick="go('home')" aria-label="Tilbake">←</button><h1>Heftet på papir</h1></div>
${guideHTML({html:'Ta fram kladdeboka! Regn oppgaven på papir først. Så sjekker du løsningen steg for steg og gir deg selv en vurdering.',mood:'happy'},50)}
<h3>Del 1 og 2 – uten kalkulator ✏️</h3><div class="list">${HEFT.filter(h=>h.del===1).map(row).join('')}</div>
<h3>Del 3 – med kalkulator 🧮</h3><div class="list">${HEFT.filter(h=>h.del===3).map(row).join('')}</div>`};
VIEWS.heftItem=()=>{const h=HEFT.find(x=>x.id===S.hid),T=TT(h.topic),n=S.hs,all=n>h.steps.length;
 return `<div class="top"><button class="xbtn" onclick="go('heft')" aria-label="Tilbake">←</button><span style="font-size:22px">${T.ico}</span><b>Oppgave ${h.id.replace('D','')}</b><span class="sp"></span><span class="tag ${h.del===3?'calc':'nc'}" style="margin:0">${h.del===3?'🧮 Kalkulator lov':'✏️ Uten kalkulator'}</span></div>
<div class="card"><div class="pr">${h.q}</div></div>
${n===0?guideHTML({html:'Regn på papir først ✏️. Trykk når du er ferdig – eller hvis du står helt fast.',mood:'happy'},48):''}
${h.steps.slice(0,n).map(s=>`<div class="hstep">${s}</div>`).join('')}
${all?`<div class="card" style="background:var(--ok2)"><b>Fasit:</b> <span style="font-size:18px;font-weight:800">${h.fa}</span></div>
${guideHTML({html:'Hvordan gikk det? Var du ærlig med deg selv? 😉',mood:'happy'},44)}
<div class="row"><button class="btn2" style="flex:1" onclick="rateHeft(0)">✅<br>Fikk det til</button><button class="btn2" style="flex:1" onclick="rateHeft(1)">🟡<br>Nesten</button><button class="btn2" style="flex:1" onclick="rateHeft(2)">🔴<br>Må øve</button></div>
<button class="btn2" style="width:100%;margin-top:10px" onclick="startRound('topic','${h.topic}')">${T.ico} Øv på ${T.name.toLowerCase()} i appen</button>`
:`<button class="btn" onclick="S.hs++;go('heftItem')">${n===0?'Vis første steg':n<h.steps.length?'Vis neste steg':'Vis fasit'}</button>`}<div style="height:14px"></div>`};
function rateHeft(r){const p=P(),h=HEFT.find(x=>x.id===S.hid);const first=p.heft[h.id]==null;p.heft[h.id]=r;
 if(r===2){const s=pick(SUBS[h.topic])[0];if(!p.ff.some(x=>x.t===h.topic&&x.s===s))p.ff.push({t:h.topic,s})}
 if(first){p.xp+=40;logT('h')}const nb=BADGES.filter(b=>!p.badges.includes(b[0])&&b[4](p));nb.forEach(b=>p.badges.push(b[0]));if(nb.length)confetti();save();
 const i=HEFT.indexOf(h);if(i<HEFT.length-1)go('heftItem',{hid:HEFT[i+1].id,hs:0});else go('heft')}

function partHTML(p){if(typeof p==='string')return p;if(p.s!=null)return slotHTML(p.s);if(p.o!=null)return widgetHTML(p.o);if(p.f)return `<span class="fr"><span>${partHTML(p.f[0])}</span><span>${partHTML(p.f[1])}</span></span>`;if(p.p)return `${partHTML(p.p[0])}<sup>${partHTML(p.p[1])}</sup>`;return ''}
function firstStep(parts){let m=null;const f=p=>{if(!p||typeof p==='string')return;if(p.s!=null)m=m==null?p.s:Math.min(m,p.s);if(p.o!=null)m=m==null?p.o:Math.min(m,p.o);if(p.f)p.f.forEach(f);if(p.p)p.p.forEach(f)};parts.forEach(f);return m}
function slotHTML(i){const st=S.st[i],step=S.task.steps[i];const cls=st.miss?'miss':st.helped?'help':st.done?'ok':(i===S.cur&&!S.finished?'on':'');
 const txt=(st.done||i===S.cur)?String(st.v).replace(/-/g,'−'):'';const w=step.one?'':`min-width:${Math.max(42,Math.min(7,String(disp(step,S.task)).length)*13+18)}px`;
 return `<span class="slot ${cls} ${S.shake===i?'shk':''}" style="${w}">${txt}</span>`}
function gridHTML(){const g=S.task.grid;return `<div class="grid" style="grid-template-columns:${g.cols}">${g.cells.map(c=>`<div class="gc ${c.ul?'ul':''} ${c.sm?'sm':''} ${c.wide?'wide':''} ${c.vb?'vb':''} ${c.rt?'rt':''}" style="grid-row:${c.r+1};grid-column:${c.c+1}">${c.s!=null?slotHTML(c.s):(S.task.fxv[c.key]!=null?S.task.fxv[c.key]:c.t)}</div>`).join('')}</div>`}
function widgetHTML(i){const step=S.task.steps[i],st=S.st[i],cur=i===S.cur&&!S.finished&&!st.done;
 if(step.k==='choice'){return `<div style="font-size:16px;font-weight:700;line-height:1.45;margin-bottom:4px">${step.q}</div>${step.opts.map((o,j)=>{const c=st.pick===j?'right':st.wx.includes(j)?'wx':'';return `<button class="opt ${c} ${S.shake===i&&st.wx[st.wx.length-1]===j?'shk':''}" ${cur?`onclick="choose(${j})"`:''}>${st.pick===j?'✅ ':''}${o.t}</button>`}).join('')}`}
 if(step.k==='order'){return `<div class="drop ${S.shake===i?'shk':''}">${st.placed.length?st.placed.map((j,k)=>`${k?'<span class="lt">&lt;</span>':''}<span class="chip okc">${step.items[j].h}</span>`).join(''):'<span class="mut" style="padding:0 10px;font-size:14px">Minst først …</span>'}</div>
  ${st.done?'':`<div>${step.items.map((x,j)=>`<button class="chip ${st.placed.includes(j)?'used':''}" ${cur?`onclick="place(${j})"`:''}>${x.h}</button>`).join('')}</div>${cur&&st.placed.length?'<button class="btn2" style="font-size:13px;padding:6px 10px" onclick="unplace()">↶ Angre</button>':''}`}`}
 if(step.k==='multi'){return `<div style="font-size:16px;font-weight:700;margin-bottom:4px">${step.q}</div><div class="${S.shake===i?'shk':''}">${step.items.map((x,j)=>`<button class="chip ${st.sel.includes(j)?(st.done?'okc':'sel'):''}" style="min-width:58px;font-size:16px" ${cur?`onclick="toggle(${j})"`:''}>${x.t}</button>`).join('')}</div>${cur?'<button class="btn g" style="margin-top:8px" onclick="checkMulti()">Sjekk ✓</button>':''}`}
 return ''}
function workHTML(){const t=S.task;let h='',gd=false;
 for(const ln of t.lines){if(ln.grid){if(ln.at==null||S.cur>=ln.at||S.finished){h+=`<div class="ln">${ln.cap?`<span class="cap">${ln.cap}</span>`:''}</div>`+gridHTML()}gd=true;continue}
  const f=firstStep(ln.parts);if(f!=null&&f>S.cur&&!S.finished)continue;
  h+=`<div class="ln">${ln.cap?`<span class="cap">${ln.cap}</span>`:''}${ln.parts.map(partHTML).join('')}</div>`}
 if(t.grid&&!gd)h=gridHTML()+h;return h}
VIEWS.task=()=>{const t=S.task,R_=S.round,T=TT(t.topic),step=t.steps[S.cur],L=lvl();
 const title=R_.mode==='exam'?'🎯 Prøvemodus':R_.mode==='trap'?'🪤 Feilfella':`${T.ico} ${T.name}`;
 const dots=R_.list.map((_,i)=>`<i class="${i<R_.i?(R_.results[i]==='s'?'s':'d'):i===R_.i?'c':''}"></i>`).join('');
 const showPad=!S.finished&&step.k==='slot';const hintAllowed=L<3;
 return `<div class="top"><button class="xbtn" onclick="quit()" aria-label="Avslutt">✕</button><b style="font-size:15px">${title}</b><span class="sp"></span><div class="dots">${dots}</div><span class="pill">✨ ${P().xp}</span></div>
<div class="card"><div class="mut" style="font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px">${R_.mode!=='topic'?T.ico+' ':''}${t.title}</div><div class="pr">${t.prompt}</div>${t.calc?'<span class="tag calc">🧮 Kalkulator lov – men skriv regnestykket</span>':'<span class="tag nc">✏️ Uten kalkulator</span>'}
${t.viz?t.viz(t):''}${workHTML()}</div>
${guideHTML(S.msg)}
${!S.finished&&step.k!=='slot'&&hintAllowed?`<div class="hintrow"><button class="btn2 ${S.glow?'glow':''}" onclick="hintBtn()">💡 Hint</button></div>`:''}
${S.finished?`<button class="btn g" id="nextb" style="margin-top:8px" onclick="nextTask()">${R_.i<R_.list.length-1?'Neste oppgave ➜':'Se resultatet 🏁'}</button><div style="height:20px"></div>`:''}
${showPad?`<div class="pad">${['7','8','9','del','4','5','6','-','1','2','3',','].map(padBtn).join('')}${hintAllowed?`<button class="hb ${S.glow?'glow':''}" onclick="hintBtn()" aria-label="Hint">💡</button>`:'<button disabled style="opacity:.3">💡</button>'}${padBtn('0')}<button class="okb" onclick="key('ok')" aria-label="Sjekk">✓</button></div>`:''}`};
const padBtn=k=>k==='del'?`<button class="op" onclick="key('del')" aria-label="Slett">⌫</button>`:k==='-'?`<button class="op" onclick="key('-')" aria-label="Minus">−</button>`:k===','?`<button class="op" onclick="key(',')" aria-label="Komma">,</button>`:`<button onclick="key('${k}')">${k}</button>`;

VIEWS.end=()=>{const R_=S.round,p=P(),T=R_.topic?TT(R_.topic):null;let head,body='';
 if(R_.mode==='exam'){head=`Prøvemodus: ${R_.pct} % riktig`;body=`<div class="mut" style="margin-top:4px">${R_.pct>=80?'Det er prøvenivå! 🏆':R_.pct>=60?'Godt! Øv litt mer i Feilfella.':'Bra at du prøvde! Ta Feilfella og prøv igjen i morgen.'}</div>`}
 else head=R_.stars===R_.list.length?'Perfekt runde! Alle stjernene!':R_.stars>=3?'Supert flydd!':'Runde fullført!';
 if(T&&R_.mode==='topic'){const a=R_.mStart[T.id]||0,b=p.m[T.id]||0;body+=`<div style="margin-top:12px;text-align:left"><div class="row" style="font-weight:800"><span>${T.ico} ${T.name}</span><span class="sp"></span>${starHTML(starsOf(b))}</div><div class="bar" style="margin-top:6px;height:10px"><i style="width:${b}%"></i></div><div class="mut" style="font-size:13px;margin-top:4px">Mestring: ${a} → ${b} av 100${starsOf(b)>starsOf(a)?' · Ny stjerne! 🎉':''}</div></div>`}
 const nb=(R_.newBadges||[]).map(b=>`<div class="bdg" style="margin-top:8px"><div class="ic">${b[1]}</div><b>Ny medalje: ${b[2]}</b><small>${b[3]}</small></div>`).join('');
 const lvlMsg=T&&R_.mode==='topic'?(p.m[T.id]>=70?'Du mestrer dette godt nå, så neste gang gir jeg deg mindre hjelp.':p.m[T.id]>=35?'Du er på vei! Jeg holder litt igjen på hintene neste gang.':'Øv litt til – jeg hjelper deg gjerne.'):'';
 return `<div style="text-align:center;margin-top:16px">${pilot(120,'wow')}</div>
<div class="card" style="text-align:center"><h1>${head}</h1>${R_.mode!=='exam'?`<div style="font-size:30px;margin:6px 0">${R_.list.map((_,i)=>i<R_.stars?'⭐':'☆').join(' ')}</div>`:''}<div style="font-size:20px;font-weight:900;color:var(--pri)">+${R_.gained} XP</div>${body}</div>
${nb}${lvlMsg?guideHTML({html:lvlMsg,mood:'happy'},50):''}
${R_.mode==='topic'?`<button class="btn" onclick="startRound('topic','${R_.topic}')">En runde til ${T.ico}</button><div style="height:10px"></div>`:''}
<button class="btn2" style="width:100%" onclick="go('home')">Til temakartet 🗺️</button><div style="height:20px"></div>`};

/* konfetti */
function confetti(){const c=$('#conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#5b3df5','#f59e0b','#16a34a','#ec4899','#0ea5e9'];
 const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*12,vy:Math.random()*-12-3,c:pick(cols),s:R(5,9),r:Math.random()*6}));let f=0;
 (function loop(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})()}

/* tastatur på datamaskin */
document.addEventListener('keydown',e=>{if(S.view!=='task')return;if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('del');else if(e.key==='Enter'){if(S.finished)nextTask();else key('ok')}else if(e.key==='-')key('-');else if(e.key===','||e.key==='.')key(',')});

/* start */
if(DB.cur&&DB.players[DB.cur])go('home');else go('start');
</script>
