<!DOCTYPE html>
<html lang="no"><head><meta charset="utf-8"><title>og</title>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Figtree:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0e1830}
.c{width:1200px;height:630px;position:relative;overflow:hidden;font-family:Figtree,sans-serif;color:#fff;
 background:radial-gradient(circle at 12% -10%,#2a4590 0,transparent 50%),radial-gradient(circle at 105% 115%,#4a1a38 0,transparent 45%),#0e1830}
.flag{position:absolute;left:0;top:0;bottom:0;width:26px;display:flex;flex-direction:column}
.flag i{flex:1}.flag i:nth-child(1){background:#2f6ce0}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#e0393e}
.yr{position:absolute;left:78px;top:40px;font-family:"Alfa Slab One",serif;font-size:300px;line-height:1;letter-spacing:-6px}
.yr span:nth-child(1){color:#2f6ce0}.yr span:nth-child(2){color:#2f6ce0}.yr span:nth-child(3){color:#fff}.yr span:nth-child(4){color:#e0393e}
.yr{background:linear-gradient(90deg,#2f6ce0 0 34%,#fff 34% 66%,#e0393e 66%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{position:absolute;left:84px;top:372px;margin:0;font-family:"Alfa Slab One",serif;font-weight:400;font-size:76px;letter-spacing:-1px}
.sub{position:absolute;left:88px;top:478px;font-size:31px;font-weight:600;color:#c3cff0}
.sub b{color:#efb02c;font-weight:800}
.tiles{position:absolute;right:70px;top:86px;display:grid;gap:18px}
.t{width:120px;height:96px;border-radius:20px;display:grid;place-items:center;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.t svg{width:52px;height:52px}
.cock{position:absolute;right:88px;bottom:62px;width:86px;height:86px}
</style></head><body>
<div class="c">
 <div class="flag"><i></i><i></i><i></i></div>
 <div class="yr">1789</div>
 <h1>Revolusjonsquizen</h1>
 <div class="sub">121 spørsmål · 5 nivåer · <b>Klarer du å storme Bastillen?</b></div>
 <div class="tiles">
  <div class="t" style="background:#e0393e"><svg viewBox="0 0 40 40"><polygon points="20,5 37,35 3,35" fill="#fff"/></svg></div>
  <div class="t" style="background:#2f6ce0"><svg viewBox="0 0 40 40"><polygon points="20,3 37,20 20,37 3,20" fill="#fff"/></svg></div>
  <div class="t" style="background:#c98a0e"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#fff"/></svg></div>
 </div>
 <svg class="cock" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#2f6ce0"/><circle cx="20" cy="20" r="13" fill="#fff"/><circle cx="20" cy="20" r="7" fill="#e0393e"/></svg>
</div>
</body></html>
